name = "Frostsim"
tracker = ".rimewire/tracker.md"
idPattern = "P[0-9]{2}\\.[0-9]+|RW-SETUP"
branchPrefix = "dev"
branchAliases = []
journalDir = ".rimewire/journal"
logo = "public/brand/favicon-64.png"
stylesheet = ".rimewire/board.css"

[palette]
mode = "auto"

[palette.colors]
[palette.light]
background = "#eef3f9"
surface = "#ffffff"
surfaceAlt = "#f3f7fb"
border = "#bccddd"
borderSoft = "#dbe6f0"
text = "#0c1a2b"
textSecondary = "#40566f"
muted = "#526880"
accent = "#0369a1"
accentSoft = "#e6f7ff"
highlight = "#e0f2fe"
done = "#047857"
active = "#0f5fc2"
spec = "#7a2fc0"
planned = "#526880"
blocked = "#c62424"
aside = "#64748b"
onSolid = "#ffffff"

[palette.dark]
background = "#0a0c11"
surface = "#1b1f27"
surfaceAlt = "#12151c"
border = "#343c4b"
borderSoft = "#292f3b"
text = "#eef3f8"
textSecondary = "#a9b3c2"
muted = "#99a4b6"
accent = "#65cbe5"
accentSoft = "#1b343e"
highlight = "#243e48"
done = "#62d5a1"
active = "#8fb8ff"
spec = "#bf88f5"
planned = "#99a4b6"
blocked = "#f87171"
aside = "#8a94a5"
onSolid = "#06121a"

[fonts]
sans = "\"Inter Variable\", ui-sans-serif, system-ui, sans-serif"
mono = "ui-monospace, \"SF Mono\", Menlo, Consolas, monospace"

[hooks]
enabled = false

[statuses]
[roadmap]
